name: Deploy website by FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}

    steps:
      - name: Check deployment settings
        shell: bash
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Set the SITE_URL repository variable before deployment."
            exit 1
          fi
          if [ -z "$FTP_SERVER_DIR" ]; then
            echo "Set FTP_SERVER_DIR to the Cityhost web root, usually /public_html/."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload website by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/client/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
